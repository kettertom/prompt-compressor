<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Background -->
  <rect width="32" height="32" rx="6" fill="#1a1d2e"/>

  <!-- Left arrow pointing right (inward) -->
  <line x1="3" y1="16" x2="11" y2="16" stroke="#60a5fa" stroke-width="2.2" stroke-linecap="round"/>
  <polyline points="8,12 12,16 8,20" fill="none" stroke="#60a5fa" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Right arrow pointing left (inward) -->
  <line x1="29" y1="16" x2="21" y2="16" stroke="#60a5fa" stroke-width="2.2" stroke-linecap="round"/>
  <polyline points="24,12 20,16 24,20" fill="none" stroke="#60a5fa" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Center compression lines -->
  <line x1="16" y1="9" x2="16" y2="23" stroke="#4ade80" stroke-width="2" stroke-linecap="round"/>
  <line x1="13" y1="12" x2="13" y2="20" stroke="#4ade80" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <line x1="19" y1="12" x2="19" y2="20" stroke="#4ade80" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
</svg>
